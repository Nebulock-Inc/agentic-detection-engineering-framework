# Extraction profile for the demo in-house format in examples/inhouse-rules/.
# See docs/creating-extraction-profiles.md for how to write one of these.
name: nebulock-hunt
version: 1
signature:
  container: yaml
  all_keys: [hunt, logic]
  extension: [.yml, .yaml]
query_language: spl
map:
  title: hunt
  query: logic
  uuid: id
  mitre: tags[]
  severity: severity
