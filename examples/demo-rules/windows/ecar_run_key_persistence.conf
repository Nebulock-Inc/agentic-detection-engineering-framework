# Registry Run-key persistence in eCAR telemetry (MITRE T1547.001)
[eCAR Run key persistence]
description = Registry writes to CurrentVersion\Run in the evidenceforge eCAR stream.
search = index=thrunt sourcetype="evidenceforge:ecar:json" object=registry action=EDIT "properties.registry_key"="*\\CurrentVersion\\Run*" \
| stats count by hostname principal "properties.image_path"
