title: Rundll32 execution without arguments
id: 4f2a1c3e-9b7d-4e5f-a1b2-c3d4e5f60718
status: experimental
description: rundll32.exe with no command-line arguments is a common process-injection host.
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    Image|endswith: '\rundll32.exe'
    CommandLine|endswith: 'rundll32.exe'
  condition: selection
tags:
  - attack.defense-evasion
  - attack.t1218.011
level: high
