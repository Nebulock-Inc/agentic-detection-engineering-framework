name: Tests

# Every long-lived branch a PR can target must be listed here. A PR into a
# branch this list omits runs no checks at all, and does so silently: there is
# no skipped-check marker on the PR and nothing in `gh run list`, so the only
# signal is the absence of one. Adding an integration branch without adding it
# here leaves that whole line of work resting on whatever gate each author
# happens to run locally.
on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

# Least-privilege default token: this workflow only reads the repo.
permissions:
  contents: read

jobs:
  test:
    name: Test — Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Lint (ruff)
      run: ruff check adef/

    - name: Type check (mypy)
      run: mypy adef/

    - name: Tests (pytest)
      # Includes the CI-enforced anti-goal tests: test_schema_parity,
      # test_no_new_engine_types, test_no_vendor_connectors, test_no_web_ui_deps.
      run: pytest -q

  build:
    name: Build package
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build package
      run: python -m build

    - name: Check package with twine
      run: twine check dist/*
